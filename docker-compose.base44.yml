services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartkarobar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartkarobar"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: on-failure

  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smartkarobar
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "apt-get update -y && apt-get install -y --no-install-recommends openssl && npm install && npx prisma generate && npx prisma db push --accept-data-loss && (npx prisma db seed || true) && exec npm run dev"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: on-failure

volumes:
  db-data:
